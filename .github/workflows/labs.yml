name: Verify Portfolio links
on:
  pull_request:
    paths: ['docs/**', 'scripts/verify-portfolio.mjs', 'scripts/build-pages.mjs', 'scripts/prepare-portfolio.mjs', 'student-config.json', '.github/workflows/labs.yml']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate twelve separate LAB links and published assets
        run: node scripts/verify-portfolio.mjs
